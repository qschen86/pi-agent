<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#534ab7">
<title>pi-agent · 网络不可用</title>
<style>
:root{color-scheme:light dark}body{margin:0;padding:24px;font:16px/1.6 system-ui,sans-serif;background:#f6f5f9;color:#242231}main{max-width:440px;margin:15vh auto;padding:28px;border-radius:20px;background:#fff;box-shadow:0 8px 32px #2422310d}.brand{color:#534ab7;font-size:32px;font-weight:700}h1{font-size:22px;margin:18px 0 8px}p{color:#625f70}button{font:inherit;min-height:44px;padding:10px 20px;border:0;border-radius:10px;background:#534ab7;color:#fff;cursor:pointer}button:focus-visible{outline:3px solid #9189cf;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#18171e;color:#f0edf8}main{background:#25232e}p{color:#c0bace}.brand{color:#aaa1ec}}
</style>
</head>
<body>
<main aria-labelledby="offline-title">
<div class="brand" aria-label="pi-agent">pi</div>
<h1 id="offline-title">网络不可用</h1>
<p>请连接网络后重新连接，继续打开原来的页面。</p>
<button id="retry" type="button">重新连接</button>
</main>
<script>
document.getElementById('retry').addEventListener('click', () => location.reload());
</script>
</body>
</html>
