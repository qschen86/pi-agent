name: Publish pi-agent (Homebrew)

# Push a tag such as v0.1.0 (it must equal v + the root package.json version) and the release is built and
# uploaded from GitHub's network instead of the maintainer's Mac. Homebrew Tap updates are a separate, later step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple Silicon, and the same macOS floor as the Formula (depends_on macos: :sequoia).
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Tag must match the package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}" >&2
            exit 1
          fi
          # Published assets are never overwritten.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm run test:homebrew

      # build-inputs.json pins these two packages; the builder rejects any other name or version.
      - name: Prepare Pi package and its dependency tree
        shell: bash
        run: |
          set -euo pipefail
          PI_VERSION="$(node -p "require('./apps/homebrew/build-inputs.json').pi.version")"
          PI_NAME="$(node -p "require('./apps/homebrew/build-inputs.json').pi.name")"
          mkdir -p "$RUNNER_TEMP/pi-source"
          cd "$RUNNER_TEMP/pi-source"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "${PI_NAME}@${PI_VERSION}"
          # Registry signatures cover the whole tree; a version number alone is not provenance.
          npm audit signatures
          echo "PI_SOURCE=$RUNNER_TEMP/pi-source/node_modules/${PI_NAME}" >> "$GITHUB_ENV"

      - name: Prepare npm package
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./apps/homebrew/build-inputs.json').npm.version")"
          mkdir -p "$RUNNER_TEMP/npm-pack"
          cd "$RUNNER_TEMP/npm-pack"
          npm pack "npm@${NPM_VERSION}" --silent
          tar -xzf "npm-${NPM_VERSION}.tgz"
          echo "NPM_SOURCE=$RUNNER_TEMP/npm-pack/package" >> "$GITHUB_ENV"

      # Pinned URLs from apps/homebrew/licenses/image-library-sources.json; the script never executes upstream code.
      - name: Fetch image library sources
        run: python3 scripts/prepare-homebrew-image-sources.py --output "$RUNNER_TEMP/image-sources"

      - name: Build release
        run: |
          node scripts/build-homebrew-release.mjs \
            --pi-source "$PI_SOURCE" \
            --npm-source "$NPM_SOURCE" \
            --image-sources "$RUNNER_TEMP/image-sources" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release"

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          shasum -a 256 -c SHA256SUMS
          ls -l

      # Not --clobber: an existing release was already rejected above, and a race fails here instead of overwriting.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          gh release create "${GITHUB_REF_NAME}" \
            "pi-agent-${VERSION}-macos-arm64.tar.gz" \
            "pi-agent-${VERSION}-source.tar.gz" \
            "pi-agent-${VERSION}-image-library-sources.tar.gz" \
            pi-agent.rb INSTALL.md SHA256SUMS \
            --verify-tag \
            --title "pi-agent ${VERSION}" \
            --generate-notes
