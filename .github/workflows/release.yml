name: Build and verify open-source candidate
on:
  push:
    branches: ['release-candidate/**']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and run Homebrew tests
        run: |
          test "$(uname -m)" = arm64
          npm ci --ignore-scripts
          npm run test:homebrew
          npx --no-install playwright install chromium
      - name: Prepare fixed release inputs
        shell: bash
        run: |
          set -euo pipefail
          pi="$(node -p "const p=require('./apps/homebrew/build-inputs.json').pi;p.name+'@'+p.version")"
          pi_name="${pi%@*}"
          npm_version="$(node -p "require('./apps/homebrew/build-inputs.json').npm.version")"
          mkdir -p "$RUNNER_TEMP/pi" "$RUNNER_TEMP/npm"
          (cd "$RUNNER_TEMP/pi" && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund "$pi" && npm audit signatures)
          (cd "$RUNNER_TEMP/npm" && npm pack "npm@$npm_version" --silent && tar -xzf "npm-$npm_version.tgz")
          python3 scripts/prepare-homebrew-image-sources.py --output "$RUNNER_TEMP/image-sources"
          node scripts/build-homebrew-release.mjs --pi-source "$RUNNER_TEMP/pi/node_modules/$pi_name" --npm-source "$RUNNER_TEMP/npm/package" --image-sources "$RUNNER_TEMP/image-sources" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release"
      - name: Install exact candidate on a clean runner and test over HTTP
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c SHA256SUMS)
          node scripts/verify-release-candidate.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-candidate
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
